<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Remediation | Sparient</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="login-screen" class="login-wrap">
    <form id="login-form" class="login-card">
      <img class="brand-logo" src="https://sparient.com/__l5e/assets-v1/1eb8d5c8-5fd8-4543-9472-9f22a8923ae1/sparient-horizontal.png" alt="Sparient">
      <h1>PDF Remediation</h1>
      <p class="hint">Sign in with your sparient id</p>
      <label for="username">Sparient ID</label>
      <input id="username" class="field" name="username" type="text" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" class="field" name="password" type="password" autocomplete="current-password" required>
      <div class="btn-row">
        <button class="btn" type="submit">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
          Sign in
        </button>
      </div>
      <p id="login-error" class="error hidden" role="alert"></p>
    </form>
  </section>

  <section id="app-screen" class="app hidden">
    <header class="topbar">
      <div class="brand-row">
        <img class="brand-logo" src="https://sparient.com/__l5e/assets-v1/1eb8d5c8-5fd8-4543-9472-9f22a8923ae1/sparient-horizontal.png" alt="Sparient">
        <h1>PDF Remediation</h1>
      </div>
      <button id="logout" class="btn secondary" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Sign out
      </button>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <h2>Uploaded files</h2>
        <div id="file-list" class="file-list">
          <p class="muted">No files yet.</p>
        </div>
      </aside>
      <main class="main">
        <h2>Upload</h2>
        <div id="dropzone" class="dropzone">
          <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
          <p>Drop PDFs here, or choose files. You can start another upload while one is remediating.</p>
          <div class="btn-row" style="justify-content: center;">
            <label class="btn" for="file-input">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
              Choose PDFs
            </label>
          </div>
          <input id="file-input" type="file" accept="application/pdf,.pdf" multiple hidden>
        </div>
        <section id="detail" class="detail">
          <p class="muted">Select a file on the left to see stats and downloads.</p>
        </section>
      </main>
    </div>
  </section>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
